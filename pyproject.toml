[project]
name = "home-operator"
version = "0.1.0"
description = "A hands-free appliance repair and maintenance add-on for Alexa+, built as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.99",
    "mcp>=2.2,<3",
]

[project.scripts]
home-operator = "home_operator.server:main"
home-operator-check-recalls = "home_operator.recalls:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
