[project]
name = "home-operator"
version = "0.1.0"
description = "A hands-free appliance repair and maintenance add-on for Alexa+, built as an MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "boto3[crt]>=1.43.99",
    "httpx>=0.28.1",
    "mcp>=2.1,<2.2",
    "strands-agents>=1.57.0",
]

[project.scripts]
home-operator = "home_operator.server:main"
home-operator-mcp = "home_operator.mcp_entry:main"
home-operator-agent = "home_operator.agent:main"
home-operator-check-recalls = "home_operator.recalls:main"
home-operator-extract = "home_operator.extract:main"

[dependency-groups]
dev = [
    "pillow>=12.3.0",
    "pypdfium2>=5.13.0",
    "pytest>=8",
]
speech = [
    "aws-sdk-bedrock-runtime[awscrt]>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/home_operator"]

[tool.pytest.ini_options]
testpaths = ["tests"]
